<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#4f46e5"/>
  <!-- Hexagon shape (the ⬡ brand icon) -->
  <polygon points="32,10 50,21 50,43 32,54 14,43 14,21" fill="none" stroke="white" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Inner phase lines suggesting compiler stages -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="white" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="14" y1="21" x2="50" y2="43" stroke="white" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="14" y1="43" x2="50" y2="21" stroke="white" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="5" fill="white"/>
  <!-- Phase dots on vertices -->
  <circle cx="32" cy="10" r="2.5" fill="#a5b4fc"/>
  <circle cx="50" cy="21" r="2.5" fill="#a5b4fc"/>
  <circle cx="50" cy="43" r="2.5" fill="#a5b4fc"/>
  <circle cx="32" cy="54" r="2.5" fill="#a5b4fc"/>
  <circle cx="14" cy="43" r="2.5" fill="#a5b4fc"/>
  <circle cx="14" cy="21" r="2.5" fill="#a5b4fc"/>
</svg>
